mutation CreateComment($input: CreateCommentInput!) {
  createComment(input: $input) {
    id
    body
    parent {
      id
    }
    post {
      id
    }
    base {
      id
      createdAt
      user {
        id
        address
        displayName
        verified
        profile {
          username
          picture
          cover
          bio
        }
        socials {
          platform
          url
        }
      }
    }
  }
}
